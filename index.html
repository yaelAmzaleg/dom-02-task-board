<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="board">
    <h1>Task Board</h1>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs to be done?">
      <select id="priority-select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error" hidden></p>

    <div id="filters" class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Done</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" class="empty">No tasks yet. Add your first one!</p>

    <footer>
      <span><strong id="left">0</strong> tasks left</span>
      <button type="button" id="clear-done">Clear completed</button>
    </footer>
  </main>
</body>
</html>
